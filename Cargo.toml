[package]
name = "vitrine"
version = "0.1.0"
edition = "2021"
description = "A Wayland kiosk compositor: boots straight into a single fullscreen application"
license = "MIT"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_winit",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

[profile.release]
lto = true
